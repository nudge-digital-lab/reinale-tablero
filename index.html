<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tablero Reinale Pets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<style>
  :root { --bosque: #1d3022; --terracota: #c4603c; --crema: #f5f3ee; --tinta-2: #5d665f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--crema); color: var(--bosque); font: 16px/1.45 "Nunito Sans", -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  form { width: 100%; max-width: 360px; background: #fff; border: 1px solid #dcd8ce; border-radius: 18px; padding: 32px 28px; text-align: center; }
  .logo { font: 700 30px/1 Lora, Georgia, serif; letter-spacing: .02em; }
  .logo span { color: var(--terracota); }
  .lema { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--tinta-2); margin: 8px 0 24px; }
  label { display: block; text-align: left; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  input { width: 100%; font-size: 16px; font-family: inherit; padding: 12px 14px; border: 1.5px solid #dcd8ce; border-radius: 10px; }
  input:focus { outline: 2px solid var(--terracota); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 14px; font-weight: 700; font-size: 16px; font-family: inherit; color: #fff; background: var(--bosque); border: 0; border-radius: 999px; padding: 12px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: #9b3a1b; font-size: 14px; min-height: 20px; margin: 10px 0 0; }
  .pie { font-size: 12px; color: var(--tinta-2); margin-top: 18px; }
</style>
</head>
<body>
<form id="f">
  <div class="logo">REINALE <span>PETS</span></div>
  <div class="lema">Tablero interno</div>
  <label for="clave">Clave</label>
  <input id="clave" type="password" inputmode="numeric" autocomplete="current-password" autofocus required>
  <button id="entrar">Entrar</button>
  <p class="error" id="error" role="alert"></p>
  <div class="pie">Studio Complex · uso interno</div>
</form>
